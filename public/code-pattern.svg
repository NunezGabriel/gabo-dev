<svg
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512"
  shape-rendering="crispEdges"
>
  <rect width="512" height="512" fill="black"/>

  <g
    font-family="monospace"
    font-size="48"
    fill="white"
    stroke="white"
    stroke-width="2"
    paint-order="stroke fill"
    text-rendering="geometricPrecision"
  >
    <!-- top -->
    <text x="32"  y="78">&lt;/&gt;</text>
    <text x="220" y="64">{}</text>
    <text x="380" y="92">&lt;/&gt;</text>

    <!-- mid -->
    <text x="90"  y="210">{}</text>
    <text x="270" y="230">&lt;/&gt;</text>

    <!-- lower -->
    <text x="50"  y="350">&lt;/&gt;</text>
    <text x="240" y="370">{}</text>
    <text x="400" y="340">&lt;/&gt;</text>

    <!-- bottom -->
    <text x="130" y="470">{}</text>
    <text x="320" y="450">&lt;/&gt;</text>
  </g>
</svg>
